name: pooleno-challenge

x-app: &app
  build: .
  image: pooleno-order-processing:local

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: pooleno
      POSTGRES_USER: pooleno
      # Local development only: no credentials, and the port is bound to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pooleno -d pooleno"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.2.2
    environment:
      # One combined broker and controller, for local use only.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: pooleno-local-kafka-01
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Containers connect to kafka:19092 and the host to 127.0.0.1:59092.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately by kafka-init, never by a stray client.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:59092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  migrate:
    <<: *app
    command: ["node", "dist/entrypoints/migrate.js"]
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
    depends_on:
      postgres:
        condition: service_healthy

  kafka-init:
    <<: *app
    command: ["node", "dist/entrypoints/init-kafka.js"]
    environment:
      KAFKA_BROKERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    # Only proves the port accepts connections, so that `up --wait` waits for the API.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  publisher:
    <<: *app
    command: ["node", "dist/entrypoints/publisher.js"]
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
      KAFKA_BROKERS: kafka:19092
    # Losing PostgreSQL ends ownership, so the process exits and a new one takes the lock.
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  matching:
    <<: *app
    command: ["node", "dist/entrypoints/matching.js"]
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
      KAFKA_BROKERS: kafka:19092
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  external:
    <<: *app
    command: ["node", "dist/entrypoints/external.js"]
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
      KAFKA_BROKERS: kafka:19092
      EXTERNAL_API_URL: http://mock-api:58080/v1/notifications
    restart: on-failure
    # Not on mock-api: the destination being down is a delivery condition, not a reason to wait.
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  mock-api:
    <<: *app
    command: ["node", "dist/mock-api/server.js"]
    environment:
      MOCK_API_HOST: 0.0.0.0
      MOCK_API_PORT: 58080
      MOCK_API_DATABASE: /var/lib/mock-api/mock-api.sqlite
    ports:
      - "127.0.0.1:58080:58080"
    volumes:
      - mock-data:/var/lib/mock-api
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(58080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  kafka-data:
  mock-data:
