name: pooleno-challenge

x-app: &app
  build: .
  image: pooleno-order-processing:local

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: pooleno
      POSTGRES_USER: pooleno
      # Local development only: no credentials, and the port is bound to loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pooleno -d pooleno"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "dist/entrypoints/migrate.js"]
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://pooleno@postgres:5432/pooleno
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    # Only proves the port accepts connections, so that `up --wait` waits for the API.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(8080, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
